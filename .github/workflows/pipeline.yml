name: Prepare shorts

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (UTC); stays inside free TTS quotas
  workflow_dispatch:
    inputs:
      max:
        description: "Stories per track"
        default: "3"

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TTS_MAX_PER_RUN: "4"
        run: npx tsx pipeline/run.ts --max=${{ inputs.max || '3' }}
      - name: Commit new shorts
        run: |
          git config user.name "news-shorts-bot"
          git config user.email "news-shorts-bot@users.noreply.github.com"
          git add data/shorts.json public/audio
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh shorts $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
